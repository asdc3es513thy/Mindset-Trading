<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E6">
<title>入定訓練場</title>
<!--
  ============================================================
  入定訓練場 · 原始碼 v2
  ------------------------------------------------------------
  檔案結構（由上至下）：
    1. <style>      樣式：顏色同字款喺 :root 嗰度改
    2. <body>       九個部分嘅外殼（內容由程式填入）
    3. <script>
       3a. 內容資料  ← 想改字，主要改呢度
       3b. 小工具
       3c. 每個部分嘅畫面
       3d. 互動（撳掣做咩）
       3e. 計時器同啟動
  特點：
    · 唔使網絡、唔使登入，放上 GitHub Pages 直接用
    · 除咗你主動撳「存低」嘅覆盤地圖，其他嘢都唔會記低
  ============================================================
-->
<style>
  /* ---------- 1. 顏色同字款 ---------- */
  :root {
    --cream: #FFF7E6;
    --cream2: #FFE9B8;
    --surface: #FFFFFF;
    --ink: #1B1B1B;
    --muted: #6B5D4F;
    --line: #1B1B1B;
    --orange: #FF4D1C;
    --orange2: #FF8A00;
    --coral: #FF5A2E;
    --yellow: #FFD21F;
    --gold: #FFC93C;
    --teal: #00B6A8;
    --teal-dark: #00968B;
    --purple: #7C5CFF;
    --purple-deep: #2E2170;
    --pink: #FF8FAB;
    --sky: #5CC4FF;
    --mint: #7BE8B0;
    --navy: #12265F;
    --night: #17151C;
    --font: "Noto Sans TC", "Noto Sans HK", "PingFang HK", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #231E17;
      --cream2: #2E271E;
      --surface: #332A20;
      --ink: #FFF6E9;
      --muted: #D8C9B5;
      --line: #000000;
      color-scheme: dark;
    }
  }

  /* ---------- 基本 ---------- */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.6;
    overflow-x: clip;
  }
  h1, h2, h3, h4, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  section { padding-block: 56px; position: relative; }
  .eyebrow { font-size: 12px; font-weight: 900; letter-spacing: .14em; }
  .h2 { font-size: clamp(34px, 8vw, 54px); font-weight: 900; line-height: 1.1; margin-top: 6px; text-wrap: balance; }
  .h3 { font-size: clamp(22px, 5vw, 28px); font-weight: 900; line-height: 1.25; text-wrap: balance; }
  .lead { font-size: 15px; margin-top: 10px; max-width: 62ch; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .grid2 { display: grid; gap: 14px; }
  .grid3 { display: grid; gap: 14px; }
  @media (min-width: 720px) {
    .grid2 { grid-template-columns: 1fr 1fr; }
    .grid3 { grid-template-columns: repeat(3, 1fr); }
  }
  [hidden] { display: none !important; }

  /* ---------- 玩具風元件 ---------- */
  .toy {
    background: var(--surface);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 22px;
    box-shadow: 5px 5px 0 var(--line);
    position: relative;
  }
  .pad { padding: 18px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 3px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 900;
    font-size: 15px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--line);
    text-decoration: none;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.big { padding: 14px 22px; font-size: 17px; }
  .btn.orange { background: var(--orange); color: #fff; }
  .btn.yellow { background: var(--yellow); color: #1B1B1B; }
  .btn.black { background: #1B1B1B; color: #fff; }
  .btn.teal { background: var(--teal); color: #1B1B1B; }
  .btn.purple { background: var(--purple); color: #fff; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-weight: 900;
    background: var(--surface); color: var(--ink);
  }
  .sticker {
    position: absolute; z-index: 2;
    background: var(--yellow); color: #1B1B1B;
    border: 2px solid #1B1B1B; border-radius: 999px;
    padding: 2px 10px; font-size: 12px; font-weight: 900;
    transform: rotate(4deg);
    box-shadow: 2px 2px 0 #1B1B1B;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 900;
    padding: 2px 8px; border-radius: 999px; border: 2px solid #1B1B1B;
    color: #1B1B1B;
  }
  .ev-research { background: var(--mint); }
  .ev-partial { background: var(--gold); }
  .ev-method { background: #B9D4FF; }
  .ev-rule { background: #E8E1D6; }
  .field {
    width: 100%; border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font-size: 15px;
    background: var(--cream); color: var(--ink);
  }
  textarea.field { resize: vertical; }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }

  /* ---------- 頂部 ---------- */
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    background: var(--cream);
    border-bottom: 3px solid var(--line);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 41; background: var(--cream);
  }
  .topbar { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; text-decoration: none; }
  .logo-mark {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--orange); color: #fff; border: 3px solid var(--line); font-size: 18px;
  }
  .nav { display: none; gap: 4px; }
  .nav a { text-decoration: none; font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 999px; }
  .nav a:hover { background: var(--cream2); }
  @media (min-width: 960px) { .nav { display: flex; } }
  .ticker { background: var(--orange); color: #fff; border-bottom: 3px solid var(--line); overflow: hidden; white-space: nowrap; }
  .ticker-track { display: inline-flex; padding: 9px 0; font-weight: 900; font-size: 15px; animation: ticker 28s linear infinite; }
  .ticker-track span { padding-right: 32px; }
  @keyframes ticker { to { transform: translateX(-50%); } }

  /* ---------- 開場 ---------- */
  .hero { padding-block: 40px 56px; }
  .hero-grid { display: grid; gap: 28px; align-items: center; }
  @media (min-width: 900px) { .hero-grid { grid-template-columns: 1.1fr .9fr; } }
  .hero-title {
    font-size: clamp(64px, 19vw, 120px); font-weight: 900; line-height: .95; margin-top: 18px;
    color: var(--orange);
    text-shadow: 4px 4px 0 var(--yellow);
  }
  .hero-tag {
    display: inline-block; margin-top: 18px; font-size: clamp(22px, 6vw, 30px); font-weight: 900;
    background: var(--yellow); color: #1B1B1B; border: 3px solid var(--line); border-radius: 999px; padding: 2px 14px;
  }
  .hero-sub { font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin-top: 6px; }

  /* 呼吸圈 */
  .breath-stage { position: relative; height: 270px; display: grid; place-items: center; margin-top: 8px; }
  .breath-ring { position: absolute; width: 250px; height: 250px; border-radius: 50%; border: 4px dashed var(--teal); }
  .breath-core {
    width: 188px; height: 188px; border-radius: 50%;
    background: linear-gradient(135deg, var(--orange), var(--orange2) 55%, var(--yellow));
    border: 4px solid var(--line); display: grid; place-items: center; text-align: center;
    animation: breath 6s ease-in-out infinite;
  }
  .breath-core.sigh { animation: sighPulse 6s ease-in-out 1; }
  .breath-word { font-size: 56px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 3px 3px 0 rgba(0,0,0,.25); }
  .breath-hint { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 900; background: rgba(255,255,255,.92); color: #1B1B1B; border-radius: 999px; padding: 2px 10px; }
  @keyframes breath { 0%, 100% { transform: scale(.86); } 50% { transform: scale(1.08); } }
  @keyframes sighPulse { 0% { transform: scale(.85); } 15% { transform: scale(1.1); } 25% { transform: scale(1.22); } 40% { transform: scale(1.24); } 100% { transform: scale(.86); } }

  /* ---------- 各部分底色 ---------- */
  .sec-stuck { background: var(--cream2); }
  .sec-tools { background: var(--purple); color: #fff; }
  .sec-low { background: var(--sky); color: #0F2233; }
  .sec-present { background: var(--mint); color: #12301F; }
  .sec-trainer { background: var(--cream); }
  .sec-loop { background: var(--cream2); }
  .sec-quiz { background: var(--night); color: #fff; }
  .sec-foot { background: var(--sky); color: #0F2233; }

  /* 翻轉卡 */
  .flip { perspective: 1200px; min-height: 290px; border: 0; padding: 0; background: none; text-align: left; width: 100%; }
  .flip-inner { position: relative; height: 100%; min-height: 290px; transition: transform .5s; transform-style: preserve-3d; }
  .flip.on .flip-inner { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .flip-back { transform: rotateY(180deg); color: #1B1B1B; }
  .glyph { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-size: 30px; font-weight: 900; color: #1B1B1B; }

  /* 工具箱 */
  .fp-panel { background: var(--navy); color: #fff; border-color: #000; }
  .fp-step { border: 2px solid rgba(255, 201, 60, .7); border-radius: 16px; padding: 14px; background: rgba(255,255,255,.06); }
  .fp-tool { background: #FFF6E9; color: #1B1B1B; border-radius: 18px; padding: 16px; border: 3px solid #000; }
  .fp-tool .field { background: #fff; color: #1B1B1B; }
  .filter { background: rgba(255,255,255,.15); color: #fff; border-color: #000; }
  .filter.on { background: var(--yellow); color: #1B1B1B; }
  .tool { background: var(--purple-deep); color: #fff; border-color: #000; }
  .tool.open { background: #FFF6E9; color: #1B1B1B; }
  .tool-head { width: 100%; background: none; border: 0; text-align: left; padding: 18px; display: flex; gap: 14px; align-items: flex-start; color: inherit; }
  .tool-num { font-size: 17px; font-weight: 900; text-align: center; margin-top: 4px; }
  .tool-body { padding: 0 18px 18px; }
  .tool-body .line { border-top: 2px dashed rgba(0,0,0,.15); padding-top: 12px; display: grid; gap: 10px; font-size: 14.5px; }
  .today { background: var(--yellow); color: #1B1B1B; }
  .group-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 30px; }
  .group-title h3 { font-size: clamp(24px, 6vw, 30px); font-weight: 900; }
  .legend { display: grid; gap: 8px; }
  @media (min-width: 720px) { .legend { grid-template-columns: repeat(4, 1fr); } }
  .legend div { background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 12px; font-size: 13px; }

  /* 低質迴路 */
  .warn { background: var(--surface); color: var(--ink); }
  .warn.on { background: #1B1B1B; color: #fff; }
  .num-dot { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; background: var(--purple); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
  .lohi { display: grid; gap: 12px; }
  @media (min-width: 720px) { .lohi { grid-template-columns: 1fr 1fr; } }
  .lohi > div { border-radius: 18px; padding: 16px; border: 2px solid var(--line); }
  .lo { background: #FFF0F0; color: #4A1B1B; }
  .hi { background: #EAF6E8; color: #1E3B23; }

  /* 正視當下 */
  .feel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 720px) { .feel-grid { grid-template-columns: repeat(3, 1fr); } }
  .feel { text-align: left; padding: 16px; border: 3px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: 4px 4px 0 var(--line); }
  .feel.on { outline: 4px solid var(--yellow); }
  .feel-face { font-size: 26px; line-height: 1.1; font-weight: 700; }
  .feel-name { font-size: 28px; font-weight: 900; margin-top: 4px; }
  .af3 { display: grid; gap: 10px; }
  .af3 > div { border-radius: 16px; padding: 12px; text-align: center; border: 2px solid rgba(0,0,0,.15); background: #FFF6E9; color: #1B1B1B; }
  .af3 > div.best { background: #EFFFFC; border-color: var(--teal-dark); }

  /* 訓練機 */
  .timer-card { background: var(--teal); color: #1B1B1B; }
  .timer-num { font-size: clamp(64px, 18vw, 96px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 4px 4px 0 rgba(0,0,0,.2); }
  .bar { height: 14px; border: 2px solid #1B1B1B; border-radius: 999px; background: rgba(255,255,255,.6); overflow: hidden; }
  .bar > div { height: 100%; background: var(--yellow); transition: width .4s; }
  .phase { display: grid; grid-template-columns: 2fr 10fr 3fr; gap: 4px; margin-top: 8px; }
  .phase span { font-size: 11px; font-weight: 900; text-align: center; border-radius: 999px; padding: 2px 0; background: rgba(255,255,255,.45); }
  .phase span.now { background: #1B1B1B; color: #fff; }
  .alarm { background: var(--coral); color: #fff; border-radius: 18px; border: 3px solid #1B1B1B; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs .btn { flex: 1; min-width: 56px; padding: 8px 6px; font-size: 13px; }
  .tabs .btn.on { background: var(--orange); color: #fff; }
  .toast { background: var(--yellow); color: #1B1B1B; border: 2px solid #1B1B1B; border-radius: 14px; padding: 10px 12px; font-weight: 900; font-size: 14px; }
  .map-item { border: 2px dashed var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; }

  /* 正向迴路 */
  .loop-wrap { position: relative; width: 300px; height: 300px; max-width: 100%; margin: 10px auto 0; }
  .loop-circle { position: absolute; inset: 34px; border-radius: 50%; border: 4px dashed var(--line); display: grid; place-items: center; text-align: center; background: var(--surface); }
  .loop-node { position: absolute; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 6px 10px; text-align: center; min-width: 88px; box-shadow: 3px 3px 0 var(--line); font-size: 12px; }
  .loop-node b { display: block; font-size: 17px; }
  .loop-node i { position: absolute; top: -9px; left: -7px; width: 20px; height: 20px; border-radius: 50%; background: #1B1B1B; color: #fff; font-style: normal; font-size: 11px; display: grid; place-items: center; }

  /* 404 小測驗 */
  .case { background: var(--orange); color: #fff; border-color: #000; }
  .case-inner { background: rgba(0,0,0,.22); border-radius: 16px; padding: 14px; }
  .q { background: #2A2730; color: #fff; border-color: #000; }
  .opt { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; background: #fff; color: #1B1B1B; border: 3px solid #000; border-radius: 18px; padding: 10px 14px; font-weight: 800; box-shadow: 3px 3px 0 #000; }
  .opt .k { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; border: 2px solid #1B1B1B; display: grid; place-items: center; font-size: 13px; }
  .opt.right { background: var(--mint); }
  .opt.wrong { background: #FFC9C9; }

  /* 結尾 */
  .mascot { width: 150px; height: 150px; border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; border: 4px solid #1B1B1B; margin: 0 auto; display: grid; place-items: center; text-align: center; box-shadow: 6px 6px 0 #1B1B1B; color: #1B1B1B; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<!-- ============ 2. 外殼 ============ -->
<header class="top">
  <div class="wrap topbar">
    <a class="logo" href="#top"><span class="logo-mark">入</span>入定訓練場</a>
    <nav class="nav" aria-label="章節">
      <a href="#stuck">卡點地圖</a><a href="#tools">27 招</a><a href="#lowloop">避開低質迴路</a>
      <a href="#present">正視當下</a><a href="#trainer">訓練機</a><a href="#loop">正向迴路</a><a href="#quiz">404 小測驗</a>
    </nav>
    <a class="btn purple" href="#trainer">即刻開波 →</a>
  </div>
</header>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<main id="top">
  <section class="hero"><div class="wrap hero-grid" id="hero"></div></section>
  <section class="sec-stuck" id="stuck"><div class="wrap" id="stuckBox"></div></section>
  <section class="sec-tools" id="tools"><div class="wrap" id="toolsBox"></div></section>
  <section class="sec-low" id="lowloop"><div class="wrap" id="lowBox"></div></section>
  <section class="sec-present" id="present"><div class="wrap" id="presentBox"></div></section>
  <section class="sec-trainer" id="trainer"><div class="wrap" id="trainerBox"></div></section>
  <section class="sec-loop" id="loop"><div class="wrap" id="loopBox"></div></section>
  <section class="sec-quiz" id="quiz"><div class="wrap" id="quizBox"></div></section>
  <footer class="sec-foot" style="padding-block:56px"><div class="wrap" id="footBox"></div></footer>
</main>

<script>
/* ============================================================
   3a. 內容資料 ← 想改字，主要改呢度
   ============================================================ */

const TICKER = ['唔好一次過晒', '定題先行', '兜緊圈都唔怕', '返嚟就得', '答案只係副產品', '思考過程先係主菜'];

/* 證據分級：取代舊版「科學與物理支撐」，分清楚邊啲有研究、邊啲只係經驗 */
const EVIDENCE = {
  research: { label: '有研究', cls: 'ev-research', desc: '有直接研究支持' },
  partial:  { label: '部分支持', cls: 'ev-partial', desc: '原理有研究，做法或數字係自己定' },
  method:   { label: '思考方法', cls: 'ev-method', desc: '邏輯同科學方法，唔係實驗結論' },
  rule:     { label: '經驗法則', cls: 'ev-rule', desc: '好用，但未有研究證明' }
};

/* 卡點地圖：兩個真實卡點 */
const STUCK_CARDS = [
  { id: 'many', tag: '警號 · 諗到打結', glyph: '~', color: '#00B6A8',
    title: '諗嘢諗到太多',
    front: '諗到第一個諗法，又驚唔夠好；諗到第二個，又諗起第三個。愈諗愈多，愈多愈唔郁得。',
    action: '三個假設排除法 + 限時守一法',
    reason: '唔使諗到完美先郁。開三個假設，每個配一個驗證，限時 10 分鐘守一。諗多唔係問題，冇出口先係問題。俾自己一個出口，個腦會鬆啲。' },
  { id: 'lost', tag: '警號 · 做到一半迷路', glyph: '?', color: '#FFC93C',
    title: '整整下唔知做緊咩',
    front: '明明整緊 A，點解而家喺度整緊 Z？中間發生咩事，連自己都唔知。',
    action: '返嚟口令法 + 覆盤收尾法',
    reason: '講一次：阿Thy，返嚟。返去上一句事實，唔好返去上一句焦慮。問返自己：原本定題係咩？而家呢步同定題有咩關係？答唔到，就係要返轉頭嘅時候。' }
];

function phaseHTML() {
  const used = 900 - S.timeLeft;
  const now = used < 120 ? 0 : used < 720 ? 1 : 2;
  const active = S.running || used > 0;
  return ['定題', '守一', '覆盤'].map((p, i) => `<span class="${active && i === now ? 'now' : ''}">${p}</span>`).join('');
}

let sighTimer = null, alarmTimer = null, burstTimer = null;

function stepTo(n) {
  S.step = Math.min(5, Math.max(1, n));
  S.burst++;
  renderTrainer();
  clearTimeout(burstTimer);
  burstTimer = setTimeout(() => { S.burst = 0; renderTrainer(); }, 1400);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.matches('input[type=checkbox]')) return;
  const act = el.dataset.act;
  switch (act) {
    case 'sigh':
      S.sighing = true; S.sighCount++; renderHero();
      clearTimeout(sighTimer);
      sighTimer = setTimeout(() => { S.sighing = false; renderHero(); }, 6000);
      break;
    case 'flip': S.flipped[el.dataset.id] = !S.flipped[el.dataset.id]; renderStuck(); break;
    case 'fpToggle': S.fpOpen = !S.fpOpen; renderTools(); break;
    case 'fpDo': S.fpDone++; renderTools(); break;
    case 'filter': S.filter = el.dataset.f; renderTools(); break;
    case 'tool': {
      const n = Number(el.dataset.n);
      S.openTool = S.openTool === n ? null : n;
      renderTools();
      break;
    }
    case 'openToday': {
      const t = todayTool();
      S.filter = '全部'; S.openTool = t.n; renderTools();
      $('#tool-' + t.n)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'nextToday': S.todayOffset++; renderTools(); renderHero(); break;
    case 'warn': { const id = Number(el.dataset.id); S.warnings[id] = !S.warnings[id]; renderLow(); break; }
    case 'swap': S.swap = S.swap === el.dataset.id ? null : el.dataset.id; renderLow(); break;
    case 'lowFp': S.lowFp = !S.lowFp; renderLow(); break;
    case 'feel': S.feeling = S.feeling === el.dataset.id ? null : el.dataset.id; renderPresent(); renderFoot(); break;
    case 'afToggle': S.afOpen = !S.afOpen; S.afDone = false; renderPresent(); break;
    case 'afDone': S.afDone = true; renderPresent(); break;
    case 'afClear': S.afText = ''; S.afDone = false; renderPresent(); break;
    case 'tToggle': S.running = !S.running; S.toast = ''; renderTrainer(); break;
    case 'tReset': S.running = false; S.timeLeft = 900; S.toast = ''; renderTrainer(); break;
    case 'tDone': S.running = false; S.timeLeft = 0; S.toast = '你自己撳完成都算數，最緊要記得覆盤三句。'; S.step = 5; renderTrainer(); break;
    case 'alarm':
      S.alarm = true; renderTrainer();
      clearTimeout(alarmTimer);
      alarmTimer = setTimeout(() => { S.alarm = false; renderTrainer(); }, 8000);
      break;
    case 'alarmOff': S.alarm = false; renderTrainer(); break;
    case 'step': stepTo(Number(el.dataset.n)); break;
    case 'prev': stepTo(S.step - 1); break;
    case 'next': stepTo(S.step + 1); break;
    case 'finish': S.toast = '叮！你完成咗一圈啦。下次兜圈嗰陣，你會比今次更快認到路。'; S.running = false; renderTrainer(); break;
    case 'saveMap': {
      if (!S.review.some(Boolean)) { S.toast = '先寫低最少一句覆盤，先有地圖可以存。'; renderTrainer(); break; }
      const d = new Date();
      const list = loadMaps();
      list.unshift({ date: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`, topic: S.topic, review: S.review.slice() });
      S.toast = saveMaps(list.slice(0, 50)) ? '📍 地圖存好咗，只存喺呢部手機。' : '呢個瀏覽器唔俾儲存（可能係無痕模式），可以影張相留低。';
      renderTrainer();
      break;
    }
    case 'delMap': {
      const list = loadMaps(); list.splice(Number(el.dataset.i), 1); saveMaps(list); renderTrainer();
      break;
    }
    case 'quiz': S.quiz[Number(el.dataset.q)] = el.dataset.k; renderQuiz(); break;
    case 'again':
      Object.assign(S, { step: 1, topic: '', facts: ['', '', ''], hyps: ['', '', ''], verifyText: '', review: ['', '', ''], timeLeft: 900, running: false, toast: '' });
      renderTrainer();
      $('#trainer').scrollIntoView({ behavior: 'smooth' });
      break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'remind') { S.showReminders = e.target.checked; renderLoop(); }
});

/* 打字：只更新狀態，唔重畫，咁就唔會甩焦點 */
document.addEventListener('input', (e) => {
  const el = e.target;
  const key = el.dataset.bind;
  if (!key) return;
  if (Array.isArray(S[key])) {
    S[key][Number(el.dataset.i)] = el.value;
    const fc = $('#factCount'); if (fc && key === 'facts') fc.textContent = `${S.facts.filter(Boolean).length}/3`;
    const hc = $('#hypCount'); if (hc && key === 'hyps') hc.textContent = `${S.hyps.filter(Boolean).length}/3`;
  } else {
    S[key] = el.value;
    if (key === 'afText') S.afDone = false;
  }
});

/* ============================================================
   3e. 計時器同啟動
   ============================================================ */
setInterval(() => {
  S.breath = S.breath === '吸吸' ? '呼' : '吸吸';
  if (!S.sighing) {
    const w = $('.breath-word'), h = $('.breath-hint');
    if (w) w.textContent = S.breath;
    if (h) h.textContent = S.breath === '吸吸' ? '慢慢吸入…' : '慢慢呼出…';
  }
}, 3000);

setInterval(() => {
  if (!S.running) return;
  S.timeLeft = Math.max(0, S.timeLeft - 1);
  if (S.timeLeft === 0) {
    S.running = false;
    S.toast = '叮！15 分鐘完成，唔好急住開新嘢，先覆盤三句啦。';
    S.step = 5;
    renderTrainer();
    return;
  }
  const pct = ((900 - S.timeLeft) / 900) * 100;
  const n = $('#tNum'); if (n) n.textContent = `${pad2(Math.floor(S.timeLeft / 60))}:${pad2(S.timeLeft % 60)}`;
  const b = $('#tBar'); if (b) b.style.width = pct + '%';
  const p = $('#tPct'); if (p) p.textContent = `已完成 ${Math.round(pct)}%`;
  const ph = $('#tPhase'); if (ph) ph.innerHTML = phaseHTML();
  const st = $('#tState'); if (st) st.textContent = '計緊…';
}, 1000);

renderTicker();
renderHero();
renderStuck();
renderTools();
renderLow();
renderPresent();
renderTrainer();
renderLoop();
renderQuiz();
renderFoot();
</script>
</body>
</html>
