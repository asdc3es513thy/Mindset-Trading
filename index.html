<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF7E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231E17" media="(prefers-color-scheme: dark)">
<title>入定訓練場</title>
<!--
  ============================================================
  入定訓練場 · 原始碼 v2.4（2026-11-14）
  ------------------------------------------------------------
  原則：
    · 你原本寫嘅字（27 招、卡點、低質迴路、正視當下、訓練機、
      小測驗）一個字都冇改，全部由原頁面資料直接搬過嚟。
    · 我加嘅嘢全部有標示：
        「核對」      每一招下面嗰行證據分級同說明
        「今日一招」  每日輪一招
        「存低地圖」  覆盤三句可以存喺呢部手機
        「階段」      計時器下面顯示定題／守一／覆盤
        「實況核對」  404 小測驗入面嘅 GitHub 公開紀錄
        一行凍水安全提示
    · v2.2 後加（全部標明「後加 v2.2」，原文一個字都冇改）：
        「第一性原理 · 深入六步」  喺四步面板下面
        「底層創造 · 第 28 招點樣創」  喺第 28 招下面
        「反脆弱 · 深入六步」  喺反脆弱小實驗上面
        第 22 招嘅「核對」補咗研究，分級由經驗法則改做部分支持
    · v2.3 後加（標明「後加 v2.3」，原文一個字都冇改）：
        「跨維地圖 · 入定 × 推理」  喺正向長遠迴路入面
        存低覆盤地圖嗰陣，會一齊存低今圈嘅「起點格」
    · v2.4 只改外觀（字、步驟、撳掣做咩，全部冇郁）：
        你張海景相做固定背景（相已經放咗入呢個檔，唔使另外上載）
        各部分底色拎走，卡片變半透明，邊框闊度改成 0.0001px
        想還原舊外觀：刪走 <style> 最尾「v2.4 外觀」成段
    · 修正：打字唔會再甩焦點；計時器跟真實時間行；
      文字同底色對比度；深色模式。
  檔案結構（由上至下）：
    1. <style>      樣式：顏色喺最頂嗰段改
    2. <body>       每個部分嘅外殼（內容由程式填入）
    3. <script>
       3a. 內容資料  ← 想改字，主要改呢度
       3b. 小工具
       3c. 每個部分嘅畫面
       3d. 互動（撳掣做咩）
       3e. 計時器同啟動
  唔使網絡、唔使登入。除咗你主動撳「存低」嘅覆盤地圖，
  其他嘢都唔會記低。
  ============================================================
-->
<style>
  /* ============ 1. 顏色 ============ */
  /* 會跟深色模式變嘅顏色 */
  :root, .toy, .btn, .chip, .field {
    --cream: #FFF7E6;
    --cream2: #FFE9B8;
    --surface: #FFFFFF;
    --ink: #1B1B1B;
    --muted: #6B5D4F;
    --line: #1B1B1B;
    --field-line: #1B1B1B;
    --c-coral: #C2330B;
    --c-teal: #00756C;
    --c-purple: #5A3FE0;
    --c-gold: #8A6100;
    --c-pink: #B8325A;
  }
  @media (prefers-color-scheme: dark) {
    :root, .toy, .btn, .chip, .field {
      --cream: #231E17;
      --cream2: #2E271E;
      --surface: #332A20;
      --ink: #FFF6E9;
      --muted: #D8C9B5;
      --line: #000000;
      --field-line: #9A8A74;
      --c-coral: #FF9C7D;
      --c-teal: #5FE0D2;
      --c-purple: #BFB0FF;
      --c-gold: #FFC93C;
      --c-pink: #FF9DB6;
    }
  }
  /* 固定淺色底／固定深色底：唔跟深色模式變 */
  .on-light {
    --ink: #1B1B1B; --muted: #4A4238; --line: #1B1B1B; --field-line: #1B1B1B;
    --c-coral: #A82B06; --c-teal: #005F57; --c-purple: #4B32C8; --c-gold: #6B4A00; --c-pink: #9C2749;
    color: var(--ink);
  }
  .on-dark {
    --ink: #FFFFFF; --muted: #E6E0FA; --line: #000000;
    --c-coral: #FFB9A3; --c-teal: #8CEBDD; --c-purple: #D6CCFF; --c-gold: #FFD21F; --c-pink: #FFC2D1;
    color: var(--ink);
  }
  /* 固定色 */
  :root {
    --orange: #FF4D1C;
    --orange-btn: #D63A0F;
    --orange2: #FF8A00;
    --coral: #FF5A2E;
    --yellow: #FFD21F;
    --gold: #FFC93C;
    --teal: #00C2A8;
    --teal-dark: #007A70;
    --purple: #7352F5;
    --purple-deep: #3B2A7A;
    --pink: #FF8FAB;
    --sky: #5CC4FF;
    --sky-btn: #38B6FF;
    --mint: #7BE8B0;
    --navy: #12265F;
    --night: #14142B;
    --font: "Noto Sans TC", "Noto Sans HK", "PingFang HK", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }

  /* ============ 基本 ============ */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.6;
    overflow-x: clip;
  }
  h1, h2, h3, h4, p, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--c-purple); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .wrap {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  section, footer { position: relative; overflow: hidden; padding-block: 56px; scroll-margin-top: 62px; }
  .eyebrow { font-size: 15px; font-weight: 900; letter-spacing: .06em; }
  .h2 { font-size: clamp(36px, 9.5vw, 58px); font-weight: 900; line-height: 1.08; margin-top: 4px; text-wrap: balance; }
  .h3 { font-size: clamp(22px, 5.6vw, 30px); font-weight: 900; line-height: 1.25; text-wrap: balance; }
  .lead { font-size: 15px; margin-top: 10px; max-width: 62ch; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .xs { font-size: 12.5px; }
  .b8 { font-weight: 800; }
  .b9 { font-weight: 900; }
  .center { text-align: center; }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .between { justify-content: space-between; }
  .grid2, .grid3, .grid4 { display: grid; gap: 16px; }
  @media (min-width: 720px) {
    .grid2 { grid-template-columns: 1fr 1fr; }
    .grid3 { grid-template-columns: repeat(3, 1fr); }
    .grid4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1000px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }
  .sec-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
  .c-coral { color: var(--c-coral); }
  .c-teal { color: var(--c-teal); }
  .c-purple { color: var(--c-purple); }
  .c-gold { color: var(--c-gold); }
  .c-pink { color: var(--c-pink); }

  /* ============ 玩具風元件 ============ */
  .toy {
    background: var(--surface);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 26px;
    box-shadow: 6px 6px 0 var(--line);
    position: relative;
  }
  .pad { padding: 20px; }
  .box { background: var(--cream); border-radius: 14px; padding: 10px 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 3px solid #1B1B1B;
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 900;
    font-size: 15px;
    line-height: 1.3;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 5px 0 #1B1B1B;
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1B1B1B; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.big { padding: 13px 22px; font-size: 17px; }
  .btn.orange { background: var(--orange-btn); color: #fff; }
  .btn.yellow { background: var(--yellow); color: #1B1B1B; }
  .btn.black { background: #1B1B1B; color: #fff; }
  .btn.white { background: #fff; color: #1B1B1B; }
  .btn.cream { background: #FFF6E9; color: #1B1B1B; }
  .btn.sky { background: var(--sky-btn); color: #1B1B1B; }
  .btn.teal { background: var(--teal-dark); color: #fff; }
  .btn.navy { background: var(--navy); color: #fff; }
  @media (hover: hover) {
    .btn:hover { transform: translateY(-2px) rotate(-1deg); }
    .btn.wig:hover { animation: btnWiggle .35s ease-in-out; }
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid #1B1B1B; border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-weight: 900; line-height: 1.4;
    background: var(--surface); color: var(--ink);
  }
  .chip.toyish { border-width: 3px; box-shadow: 0 4px 0 #1B1B1B; }
  .chip.yellow { background: var(--yellow); color: #1B1B1B; }
  .chip.mint { background: var(--mint); color: #1B1B1B; }
  .chip.teal { background: var(--teal-dark); color: #fff; }
  .chip.black { background: #1B1B1B; color: #fff; }
  .chip.orange { background: var(--orange-btn); color: #fff; }
  .chip.white { background: #fff; color: #1B1B1B; }
  .chip.cream2 { background: #FFE9B8; color: #1B1B1B; }
  .tilt { transform: rotate(-2deg); }

  .sticker {
    position: absolute; z-index: 3;
    background: var(--yellow); color: #1B1B1B;
    border: 2.5px solid #1B1B1B; border-radius: 999px;
    padding: 3px 10px; font-size: 13px; font-weight: 900; white-space: nowrap;
    box-shadow: 3px 3px 0 #1B1B1B;
    transform: rotate(-7deg);
    animation: stickerBob 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  .sticker.pink { background: var(--pink); }
  .sticker.mint { background: var(--mint); }
  .sticker.sky { background: var(--sky-btn); }
  .sticker.orange { background: var(--orange-btn); color: #fff; }

  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 900; line-height: 1.5;
    padding: 1px 8px; border-radius: 999px; border: 1.5px solid #1B1B1B;
    color: #1B1B1B; background: #fff; white-space: nowrap;
  }
  .ev-research { background: #7BE8B0; }
  .ev-partial { background: #FFC93C; }
  .ev-method { background: #B9D4FF; }
  .ev-rule { background: #E8E1D6; }
  .tag-strict { background: #FFD21F; }

  .field {
    display: block; width: 100%;
    border: 2px solid var(--field-line); border-radius: 14px;
    padding: 12px 14px; font-size: 16px;
    background: var(--cream); color: var(--ink);
  }
  .field::placeholder { color: var(--muted); opacity: 1; }
  .field.white { background: #fff; color: #1B1B1B; border-color: #1B1B1B; }
  .field.white::placeholder { color: #6B5D4F; }
  textarea.field { resize: vertical; }

  .num-dot {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%;
    background: var(--c-purple); color: var(--surface);
    display: inline-grid; place-items: center; font-size: 13px; font-weight: 900;
  }
  .num-dot.white { background: #fff; color: #1B1B1B; }
  .steps-list { display: grid; gap: 10px; }
  .steps-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }

  .pop { animation: bounceIn .45s cubic-bezier(.2, 1.6, .4, 1) both; }

  /* 浮動裝飾（純裝飾） */
  .shapes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .shapes > span { position: absolute; animation: floaty 3.4s ease-in-out infinite; filter: drop-shadow(2px 3px 0 rgba(27, 27, 27, .12)); }
  .shapes .s1 { left: 4%; top: 10%; font-size: 26px; line-height: 1; color: #FF4D1C; animation-duration: 2.6s; }
  .shapes .s2 { right: 6%; top: 14%; font-size: 30px; line-height: 1; color: #FFD21F; animation-duration: 4.6s; }
  .shapes .s3 { left: 8%; bottom: 10%; width: 34px; height: 34px; border-radius: 50%; background: #7BE8B0; border: 3px solid #1B1B1B; }
  .shapes .s4 { right: 10%; bottom: 14%; width: 28px; height: 28px; border-radius: 8px; background: #38B6FF; border: 3px solid #1B1B1B; animation-duration: 4.6s; }
  .shapes .s5 { left: 46%; top: 6%; width: 58px; height: 18px; border: 4px solid; border-color: #FF8FAB transparent transparent transparent; border-radius: 50%; animation-duration: 2.6s; }
  .shapes .s6 { right: 24%; top: 62%; font-size: 22px; line-height: 1; color: #8B5CFF; }

  /* ============ 頂部 ============ */
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    background: var(--cream);
    border-bottom: 3px solid var(--line);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 41; background: var(--cream);
  }
  .topbar { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; text-decoration: none; white-space: nowrap; }
  .logo-mark {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--orange-btn); color: #fff; border: 3px solid #1B1B1B; font-size: 20px;
    box-shadow: 3px 3px 0 #1B1B1B; animation: wiggle 2.4s ease-in-out infinite;
  }
  .fun { display: none; }
  @media (min-width: 640px) { .fun { display: inline-flex; font-size: 12px; padding: 1px 8px; box-shadow: 2px 2px 0 #1B1B1B; } }
  .nav { display: none; gap: 2px; }
  .nav a { text-decoration: none; font-weight: 800; font-size: 14px; padding: 6px 9px; border-radius: 999px; }
  .nav a:hover { color: var(--c-coral); }
  @media (min-width: 1000px) { .nav { display: flex; } }
  .topbar .btn { padding: 8px 14px; font-size: 14px; }
  .ticker { background: var(--yellow); color: #1B1B1B; border-bottom: 3px solid #1B1B1B; overflow: hidden; white-space: nowrap; }
  .ticker-track { display: inline-flex; padding: 9px 0; font-weight: 900; font-size: 14px; animation: marquee 18s linear infinite; }
  .ticker-track span { flex: 0 0 auto; padding-right: 32px; }

  /* ============ 開場 ============ */
  .sec-hero { background: var(--cream); padding-block: 36px 52px; }
  .hero-grid { display: grid; gap: 34px; align-items: center; }
  @media (min-width: 960px) { .hero-grid { grid-template-columns: 1.15fr .85fr; } }
  .hero-title {
    font-size: clamp(68px, 19vw, 118px); font-weight: 900; line-height: .98; margin-top: 18px;
    text-shadow: 4px 4px 0 var(--yellow);
  }
  @media (prefers-color-scheme: dark) { .hero-title { text-shadow: 4px 4px 0 #8A6100; } }
  .hero-title .dot { color: var(--orange); }
  .wobble { display: inline-block; transform-origin: 0 50%; animation: titleWobble 4.2s ease-in-out infinite; }
  .hero-line { margin-top: 16px; font-size: clamp(20px, 5.4vw, 24px); font-weight: 900; line-height: 1.5; }
  .hero-tag { background: var(--yellow); color: #1B1B1B; border: 2px solid #1B1B1B; border-radius: 999px; padding: 0 10px; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); animation: pulseDot 1.2s ease-in-out infinite; }

  /* 呼吸圈 */
  .breath-stage { position: relative; height: 290px; display: grid; place-items: center; margin-top: 10px; }
  .breath-ring { position: absolute; width: 264px; height: 264px; border-radius: 50%; border: 4px dashed var(--teal); animation: ringPulse 6s ease-in-out infinite; }
  .breath-core {
    position: relative;
    width: 188px; height: 188px; border-radius: 50%;
    background: linear-gradient(135deg, #FF4D1C, #FF8A00 55%, #FFD21F);
    border: 4px solid #1B1B1B; display: grid; place-items: center; text-align: center;
    box-shadow: 0 0 0 6px rgba(255, 210, 31, .55), 0 0 42px rgba(255, 77, 28, .5), 8px 10px 0 #1B1B1B;
    animation: breath 6s ease-in-out infinite;
  }
  .breath-core.sigh { animation: sighPulse 6s ease-in-out 1; }
  .breath-word { font-size: 56px; font-weight: 900; color: #1B1B1B; line-height: 1; text-shadow: 3px 3px 0 rgba(255, 255, 255, .35); }
  .breath-hint { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 900; background: #fff; color: #1B1B1B; border-radius: 999px; padding: 2px 10px; }
  .breath-tag { position: absolute; font-size: 12.5px; font-weight: 900; padding: 3px 9px; border-radius: 999px; color: #fff; }
  .breath-tag.in { top: 8px; left: 8px; background: var(--teal-dark); transform: rotate(-6deg); }
  .breath-tag.out { bottom: 10px; right: 10px; background: #1B1B1B; border: 1px solid #5A5A5A; transform: rotate(4deg); }
  .sigh-box { margin-top: 14px; border: 2px solid var(--c-coral); border-radius: 16px; padding: 12px; text-align: center; }

  /* ============ 各部分底色 ============ */
  .sec-stuck { background: var(--cream2); border-block: 3px solid var(--line); }
  .sec-tools { background: var(--purple); --muted: #FFFFFF; }
  .sec-low { background: var(--sky); --ink: #0F2233; --muted: #1F3A52; }
  .sec-present { background: var(--mint); border-block: 3px solid #1B1B1B; --ink: #12301F; --muted: #214A30; }
  .sec-trainer { background: var(--cream2); }
  .sec-loop { background: var(--cream); border-block: 3px solid var(--line); }
  .sec-quiz { background: var(--night); }
  .sec-foot { background: var(--sky); --ink: #0F2233; --muted: #1F3A52; text-align: center; }

  /* ============ 卡點地圖：翻轉卡 ============ */
  .flip { perspective: 1200px; min-height: 330px; border: 0; padding: 0; background: none; text-align: left; width: 100%; color: inherit; }
  .flip-inner { position: relative; height: 100%; min-height: 330px; transition: transform .65s cubic-bezier(.3, 1.4, .4, 1); transform-style: preserve-3d; }
  .flip.on .flip-inner { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 20px; display: flex; flex-direction: column; }
  .flip-back { transform: rotateY(180deg); }
  .flip-glyph { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #1B1B1B; display: grid; place-items: center; font-size: 38px; font-weight: 900; line-height: 1; background: var(--gold); color: #1B1B1B; margin-top: 18px; transform: rotate(-4deg); }
  .flip-reason { background: rgba(255, 255, 255, .45); border-radius: 16px; padding: 12px; margin-top: 12px; font-size: 14px; }

  /* ============ 工具箱 ============ */
  .today { background: var(--yellow); }
  .fp-panel { background: var(--navy); border-color: #000; box-shadow: 7px 7px 0 var(--gold); overflow: hidden; }
  .fp-head { width: 100%; background: none; border: 0; color: inherit; text-align: left; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .fp-icon { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 14px; background: var(--gold); color: var(--navy); border: 3px solid #000; display: grid; place-items: center; font-size: 24px; }
  .fp-title { display: block; font-size: clamp(24px, 6.4vw, 32px); font-weight: 900; line-height: 1.2; margin-top: 6px; }
  .fp-toggle { margin-left: auto; background: #fff; color: #1B1B1B; border: 2px solid #000; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 900; white-space: nowrap; }
  .fp-body { padding: 0 20px 20px; }
  .fp-step { border: 2px solid rgba(255, 201, 60, .75); border-radius: 16px; padding: 14px; background: rgba(255, 255, 255, .07); }
  .fp-tool { background: #FFF6E9; border-radius: 20px; padding: 16px; border: 3px solid #000; margin-top: 16px; }
  .fp-result { margin-top: 12px; border: 2px solid #8A6100; background: #FFF3C4; border-radius: 14px; padding: 12px; }
  .legend { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  @media (min-width: 720px) { .legend { grid-template-columns: repeat(4, 1fr); } }
  .legend div { background: var(--purple-deep); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
  .filter { background: var(--purple-deep); color: #fff; padding: 8px 16px; font-size: 14px; }
  .filter.on { background: var(--yellow); color: #1B1B1B; }
  .group-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 34px; }
  .group-title h3 { font-size: clamp(24px, 6.4vw, 32px); font-weight: 900; }
  .tool-grid { display: grid; gap: 22px; margin-top: 18px; align-items: start; }
  @media (min-width: 720px) { .tool-grid { grid-template-columns: 1fr 1fr; } }
  .tool.shut { background: var(--purple-deep); border-color: #000; }
  .tool-head { width: 100%; background: none; border: 0; text-align: left; padding: 20px; display: flex; gap: 16px; align-items: flex-start; color: inherit; }
  .tool-left { flex: 0 0 auto; display: block; }
  .shape { width: 52px; height: 52px; display: grid; place-items: center; font-weight: 900; font-size: 22px; line-height: 1; }
  .tool-num { display: block; font-size: 18px; font-weight: 900; text-align: center; margin-top: 8px; }
  .tool-main { min-width: 0; flex: 1; display: block; }
  .tool-title { display: block; font-size: 22px; font-weight: 900; line-height: 1.3; margin-top: 8px; }
  .tool-hook { display: block; font-size: 14px; margin-top: 4px; color: var(--muted); }
  .tool-toggle { display: block; font-size: 13px; font-weight: 900; margin-top: 10px; color: var(--c-gold); }
  .tool.open .tool-toggle { color: var(--c-coral); }
  .tool-body { padding: 0 20px 20px; }
  .tool-lines { border-top: 2px dashed var(--muted); padding-top: 14px; display: grid; gap: 12px; font-size: 14.5px; }
  .check-note { border: 2px dashed var(--muted); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; }
  .make28 { margin-top: 34px; border: 2px dashed var(--gold); border-radius: 22px; padding: 20px; }

  /* ============ 深入版（後加 v2.2） ============ */
  .deep-body { margin-top: 16px; border-top: 2px dashed var(--muted); padding-top: 16px; display: grid; gap: 20px; }
  .deep-h { font-size: 17px; font-weight: 900; line-height: 1.3; }
  .deep-list { display: grid; gap: 10px; margin-top: 8px; }
  .deep-list li { font-size: 14px; padding-left: 12px; border-left: 4px solid var(--c-coral); }
  .deep-steps { display: grid; gap: 14px; margin-top: 10px; }
  .deep-steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; }
  .deep-steps b { font-size: 16px; font-weight: 900; }
  .deep-pass { display: block; margin-top: 4px; font-size: 13.5px; font-weight: 800; color: var(--c-teal); }
  .deep-rows { display: grid; gap: 10px; margin-top: 8px; }
  .deep-rows div { font-size: 13.5px; overflow-wrap: anywhere; }
  .deep-rows b { display: block; font-size: 12.5px; font-weight: 900; color: var(--c-purple); }

  /* ============ 跨維地圖（後加 v2.3） ============ */
  .cross-q { border: 2px solid var(--muted); border-radius: 16px; padding: 12px; }
  .cross-q p { font-size: 14.5px; font-weight: 800; }
  .cross-q .row { margin-top: 10px; }
  .cross-q .btn { padding: 8px 14px; font-size: 14px; }
  .cross-q .btn.on { background: var(--orange-btn); color: #fff; }
  .cross-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .cross-cell { border: 2px dashed var(--muted); border-radius: 14px; padding: 10px; font-size: 12.5px; }
  .cross-cell b { display: block; font-size: 19px; font-weight: 900; line-height: 1.2; }
  .cross-cell.on { border: 3px solid var(--line); background: var(--yellow); color: #1B1B1B; box-shadow: 3px 3px 0 var(--line); }
  .cross-out { margin-top: 12px; border: 2px solid var(--c-teal); border-radius: 16px; padding: 12px; font-size: 14px; }

  /* ============ 低質迴路 ============ */
  .card-purple { background: var(--purple); border-color: #1B1B1B; --muted: #FFFFFF; }
  .warn { text-align: left; width: 100%; font: inherit; }
  .warn.on { background: var(--yellow); }
  .warn-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 900; padding: 3px 10px; border-radius: 999px; background: #EDEAFF; color: #3F3A8F; }
  .warn.on .warn-badge { background: #1B1B1B; color: #fff; }
  .lohi { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 720px) { .lohi { grid-template-columns: 1fr 1fr; } }
  .lohi > div { border-radius: 18px; padding: 16px; border: 2px solid #1B1B1B; }
  .lo { background: #FFF0F0; --ink: #4A1B1B; }
  .hi { background: #EAF6E8; --ink: #1E3B23; }
  .lohi li { font-size: 14px; }
  .echo { margin-top: 8px; font-size: 13px; font-weight: 800; background: rgba(0, 0, 0, .24); border-radius: 12px; padding: 10px; overflow-wrap: anywhere; }

  /* ============ 正視當下 ============ */
  .feel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (min-width: 720px) { .feel-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1000px) { .feel-grid { grid-template-columns: repeat(6, 1fr); } }
  .feel { text-align: left; padding: 16px; width: 100%; font: inherit; border-radius: 26px; box-shadow: 0 6px 0 var(--line); transition: transform .14s ease; }
  .feel.on { background: #1B1B1B; --ink: #fff; --muted: #E8E2D8; color: #fff; transform: translateY(-4px); }
  .feel-face { display: block; font-size: 26px; line-height: 1.15; font-weight: 700; white-space: nowrap; }
  .feel-name { display: block; font-size: 28px; font-weight: 900; line-height: 1.2; margin-top: 6px; }
  .feel-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; margin-right: 6px; }
  .af3 { display: grid; gap: 10px; margin-top: 12px; }
  @media (min-width: 480px) { .af3 { grid-template-columns: repeat(3, 1fr); } }
  .af3 > div { border-radius: 16px; padding: 12px; text-align: center; border: 2px solid var(--muted); background: var(--cream); }
  .af3 > div.best { border-color: var(--c-teal); }

  /* ============ 訓練機 ============ */
  .trainer-grid { display: grid; gap: 26px; margin-top: 26px; align-items: start; }
  @media (min-width: 960px) { .trainer-grid { grid-template-columns: .9fr 1.1fr; } }
  .timer-card { background: var(--teal); border-width: 4px; border-color: #1B1B1B; border-radius: 34px; box-shadow: 8px 8px 0 #1B1B1B, 0 0 0 5px var(--yellow); }
  .timer-pill { background: rgba(0, 0, 0, .16); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 900; }
  .timer-num { font-size: clamp(72px, 21vw, 104px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; text-shadow: 4px 4px 0 rgba(255, 255, 255, .35); margin-top: 18px; }
  .bar { height: 14px; border: 2px solid #1B1B1B; border-radius: 999px; background: rgba(255, 255, 255, .6); overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--yellow); transition: width .4s; }
  .phase { display: grid; grid-template-columns: 2fr 10fr 3fr; gap: 4px; margin-top: 8px; }
  .phase span { font-size: 11.5px; font-weight: 900; text-align: center; border-radius: 999px; padding: 2px 0; background: rgba(255, 255, 255, .5); white-space: nowrap; }
  .phase span.now { background: #1B1B1B; color: #fff; }
  .timer-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .timer-btns .btn { padding: 11px 6px; }
  .toast { margin-top: 14px; background: #fff; color: #1B1B1B; border-radius: 14px; padding: 12px; font-weight: 800; font-size: 13.5px; text-align: center; }
  .loop-big { width: 100%; margin-top: 22px; font-size: clamp(26px, 8vw, 36px); padding: 18px 10px; box-shadow: 0 8px 0 var(--yellow); animation: loopShake 2.2s ease-in-out infinite; }
  .alarm { margin-top: 14px; background: #B02E08; color: #fff; border-radius: 22px; border: 3px solid #1B1B1B; box-shadow: 6px 6px 0 #1B1B1B; padding: 14px; display: flex; gap: 12px; align-items: flex-start; animation: shake .4s ease-in-out; }
  .step-card { overflow: hidden; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs .btn { flex: 1; min-width: 56px; padding: 9px 4px; font-size: 13px; background: #FFF6E9; color: #1B1B1B; }
  .tabs .btn.on { background: var(--orange-btn); color: #fff; }
  .step-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 22px; }
  .step-nav .btn { padding: 9px 14px; font-size: 14px; }
  .map-item { border: 2px dashed var(--muted); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; overflow-wrap: anywhere; }
  .confetti { position: absolute; inset: 0 0 auto 0; height: 150px; overflow: hidden; pointer-events: none; z-index: 4; }
  .confetti-piece { position: absolute; top: -8px; width: 10px; height: 16px; border-radius: 3px; border: 1.5px solid #1B1B1B; font-size: 10px; line-height: 16px; animation: confettiFall .95s cubic-bezier(.2, .8, .4, 1) forwards; }
  .confetti-sticker { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: var(--yellow); color: #1B1B1B; border: 2px solid #1B1B1B; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 900; white-space: nowrap; box-shadow: 2px 2px 0 #1B1B1B; animation: stickerFade 2.2s ease-in forwards; }

  /* ============ 正向迴路 ============ */
  .loop-grid { display: grid; gap: 30px; margin-top: 30px; align-items: center; }
  @media (min-width: 960px) { .loop-grid { grid-template-columns: 1.1fr .9fr; } }
  .loop-wrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; margin: 0 auto; }
  .loop-ring { position: absolute; inset: 18px; border-radius: 50%; border: 3px dashed var(--c-coral); opacity: .6; animation: spinSlow 40s linear infinite; }
  .loop-circle { position: absolute; inset: 15%; border-radius: 50%; border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--line); display: grid; place-items: center; text-align: center; background: var(--surface); padding: 16px; }
  .loop-node { position: absolute; z-index: 2; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 6px 10px; text-align: center; min-width: 88px; box-shadow: 3px 3px 0 var(--line); font-size: 11.5px; font-weight: 800; }
  .loop-node b { display: block; font-size: 19px; font-weight: 900; line-height: 1.2; white-space: nowrap; }
  .loop-node b i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; border: 1px solid var(--line); }
  .loop-node em { position: absolute; top: -9px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: #1B1B1B; color: #fff; font-style: normal; font-size: 11px; font-weight: 900; display: grid; place-items: center; border: 1px solid #5A5A5A; }
  .loop-arrow { position: absolute; color: var(--orange); font-weight: 900; font-size: 26px; line-height: 1; animation: arrowWiggle 1.1s ease-in-out infinite; }
  .remind { display: flex; gap: 12px; align-items: flex-start; padding: 16px; }
  .remind-icon { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; border: 2px solid #1B1B1B; }
  .goal { background: #1B1B1B; color: #fff; border: 1px solid #5A5A5A; border-radius: 22px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }

  /* ============ 404 小測驗 ============ */
  .case { --c-gold: #FFE680; background: #B02E08; border: 3px solid #B02E08; border-radius: 24px; box-shadow: 6px 6px 0 var(--gold); padding: 20px; }
  .case-inner { background: rgba(0, 0, 0, .24); border-radius: 16px; padding: 14px; margin-top: 14px; }
  .case-facts { background: #FFF6E9; border: 3px solid #000; border-radius: 16px; padding: 14px; margin-top: 14px; font-size: 13.5px; }
  .case-facts li { display: flex; gap: 8px; margin-top: 6px; }
  .case-facts li b { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .q { background: #2A2A45; border: 3px solid #000; border-radius: 24px; padding: 18px; }
  .opts { display: grid; gap: 10px; margin-top: 12px; }
  @media (min-width: 640px) { .opts { grid-template-columns: repeat(3, 1fr); } }
  .opt { width: 100%; text-align: left; align-items: flex-start; justify-content: flex-start; gap: 10px; background: #fff; color: #1B1B1B; border-radius: 18px; padding: 11px 12px; font-size: 14px; }
  .opt .k { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 12.5px; }
  .opt.right { background: var(--teal-dark); color: #fff; }
  .opt.wrong { background: #B02E08; color: #fff; }
  .fb { margin-top: 12px; border-radius: 14px; padding: 12px; font-size: 14px; font-weight: 800; }
  .fb.right { background: var(--teal-dark); color: #fff; }
  .fb.wrong { background: var(--yellow); color: #1B1B1B; }
  .q-end { border: 2px dashed var(--gold); background: rgba(255, 201, 60, .12); border-radius: 16px; padding: 14px; text-align: center; font-weight: 800; font-size: 14px; }

  /* ============ 結尾 ============ */
  .mascot { position: relative; width: 150px; height: 150px; border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; border: 3px solid #1B1B1B; margin: 0 auto; display: grid; place-items: center; text-align: center; box-shadow: 6px 6px 0 #1B1B1B; color: #1B1B1B; }
  .mascot-face { font-size: 34px; font-weight: 900; line-height: 1; white-space: nowrap; animation: mascotBlink 3.6s ease-in-out infinite; }
  .mascot-eyes { display: inline-block; margin-top: 8px; background: #fff; border: 2px solid #1B1B1B; border-radius: 999px; padding: 0 8px; font-size: 11.5px; font-weight: 900; }
  .mascot-tag { position: absolute; top: -12px; right: -8px; background: #fff; color: #1B1B1B; border: 2px solid #1B1B1B; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 900; transform: rotate(6deg); }
  .quote { font-size: clamp(34px, 9vw, 56px); font-weight: 900; line-height: 1.2; margin-top: 14px; }

  /* ============ 動畫 ============ */
  @keyframes bounceIn { from { transform: scale(.7) translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
  @keyframes stickerBob { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-4deg) translateY(-4px); } }
  @keyframes stickerFade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes btnWiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2deg) scale(1.04); } 75% { transform: rotate(2deg) scale(1.04); } }
  @keyframes titleWobble { 0%, 100% { transform: rotate(-1deg) scale(1); } 50% { transform: rotate(1.2deg) scale(1.015); } }
  @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .5; } }
  @keyframes marquee { to { transform: translateX(-50%); } }
  @keyframes breath { 0%, 100% { transform: scale(.82); } 38% { transform: scale(1.14); } 55% { transform: scale(1.18); } 78% { transform: scale(.9); } }
  @keyframes ringPulse { 0%, 100% { transform: scale(.92); opacity: .35; } 40% { transform: scale(1.06); opacity: .9; } 75% { transform: scale(1); opacity: .5; } }
  @keyframes sighPulse { 0% { transform: scale(.85); } 12% { transform: scale(1.02); } 22% { transform: scale(1.18); } 42% { transform: scale(1.2); } 100% { transform: scale(.88); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes loopShake { 0%, 86%, 100% { transform: rotate(-1deg) scale(1); } 88% { transform: rotate(2deg) scale(1.03) translateX(-3px); } 92% { transform: rotate(-2deg) scale(1.03) translateX(3px); } 96% { transform: rotate(1deg); } }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(148px) rotate(340deg); opacity: 0; } }
  @keyframes mascotBlink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
  @keyframes arrowWiggle { 0%, 100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(4px) rotate(8deg); } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    .confetti-piece { display: none; }
  }

  /* ============================================================
     v2.4 外觀：海景背景 + 淡化層（只改樣式，刪走成段就還原）
     想換相：換走下面 url(...) 入面嗰串字
     想背景更清楚：將 --veil 最後個數字改細（0 = 完全冇紗）
     ============================================================ */

    --glass: rgba(255, 255, 255, .56);
    --glass-soft: rgba(255, 255, 255, .42);
    --bar: rgba(255, 255, 255, .5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --veil: rgba(8, 16, 26, .56);
      --glass: rgba(18, 26, 36, .56);
      --glass-soft: rgba(0, 0, 0, .26);
      --bar: rgba(8, 16, 26, .5);
    }
  }

  body { background: transparent; }

/* 按底色揀黑字定白字，邊個清楚用邊個 */
function textOn(hex) {
  const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)));
  const L = 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  return (L + 0.05) / 0.0608 >= 1.05 / (L + 0.05) ? '#1B1B1B' : '#FFFFFF';
}

      <span class="sr-only">${f ? `阿Thy：收到，你而家有啲${esc(f.label)}` : '阿Thy 陪緊你'}</span>
    </div>
    <p class="b8" style="margin-top:18px">${f ? `阿Thy：收到，你而家有啲${esc(f.label)}，陪你慢慢嚟。` : '阿Thy 陪緊你 · 撳上面嘅感覺卡，睇下阿Thy 點變！'}</p>
    <p style="margin-top:20px"><span class="chip toyish yellow tilt">金句 · 記住佢</span></p>
    <p class="quote">每轉一圈，<br>都令下一圈更快。</p>
    <p class="small b8" style="margin-top:12px">唔使今日就變到好勁。今日快少少，聽日又快少少，就已經好叻。</p>
    <div class="row" style="justify-content:center;margin-top:26px;gap:12px">
      <a class="btn black wig" href="#top">返去頂部，再做一次嘆息 ↑</a>
      <a class="btn white wig" href="#trainer">再開一圈訓練</a>
    </div>
    <p class="xs b8" style="margin-top:34px">入定訓練場 · 答案只係副產品，思考過程先係主菜 · 兜緊圈都唔怕，阿Thy，返嚟。</p>`;
}

/* ============================================================
   3d. 互動
   ============================================================ */
let sighTimer = null, alarmTimer = null, burstTimer = null;

/* 🎉 彩紙：只係填入一個浮面嘅格，唔會重畫任何輸入格 */
const CONFETTI_COLORS = ['#FF4D1C', '#FFD21F', '#00C2A8', '#38B6FF', '#FF8FAB', '#8B5CFF'];
function burst() {
  const box = $('#confetti');
  if (!box) return;
  box.innerHTML = Array.from({ length: 22 }, (_, r) => `<span class="confetti-piece" style="left:${(r * 41) % 92 + 3}%;background:${CONFETTI_COLORS[r % 6]};animation-delay:${(r % 7) * 0.06}s">🎉</span>`).join('')
    + '<span class="confetti-sticker">🎉 叮！完成一小步！</span>';
  clearTimeout(burstTimer);
  burstTimer = setTimeout(() => { box.innerHTML = ''; }, 2300);
}

function setToast(text) {
  S.toast = text;
  const el = $('#tToast');
  if (!el) return;
  el.textContent = text;
  el.hidden = !text;
  if (text) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

function showAlarm(on) {
  S.alarm = on;
  const el = $('#alarmBox');
  if (el) el.hidden = !on;
  clearTimeout(alarmTimer);
  if (on) alarmTimer = setTimeout(() => showAlarm(false), 5200);
}

function stepTo(n, withBurst) {
  S.step = Math.min(5, Math.max(1, n));
  renderSteps();
  if (withBurst) burst();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    /* 開場 */
    case 'sigh':
      S.sighing = true; S.sighCount++; setToast(''); renderBreath();
      clearTimeout(sighTimer);
      sighTimer = setTimeout(() => { S.sighing = false; renderBreath(); }, 6000);
      break;
    /* 卡點地圖：只加減一個 class，等張卡真係翻轉 */
    case 'flip': {
      const id = el.dataset.id;
      S.flipped[id] = !S.flipped[id];
      el.classList.toggle('on', S.flipped[id]);
      el.setAttribute('aria-pressed', S.flipped[id]);
      break;
    }
    /* 工具箱 */
    case 'fpToggle': S.fpOpen = !S.fpOpen; renderFp(); burst(); break;
    case 'fpDo': S.fpShown = true; S.fpCount++; updateFpResult(); burst(); break;
    case 'fpDeep': S.fpDeep = !S.fpDeep; renderFp(); break;
    case 'createDeep': S.createDeep = !S.createDeep; renderToolList(); break;
    case 'afDeep': S.afDeep = !S.afDeep; renderPresent(); break;
    case 'crossDeep': S.crossDeep = !S.crossDeep; renderLoop(); break;
    case 'crossAns': {
      S[el.dataset.k] = el.dataset.v === 'y';
      const k = crossKey();
      if (k && !S.crossStart) S.crossStart = CROSS_CELLS[k].name;
      renderLoop(); if (k) burst();
      break;
    }
    case 'crossAgain': S.cq1 = null; S.cq2 = null; renderLoop(); break;
    case 'crossNew': S.cq1 = null; S.cq2 = null; S.crossStart = ''; renderLoop(); break;
    case 'filter': S.filter = el.dataset.f; renderToolList(); break;
    case 'tool': {
      const n = Number(el.dataset.n);
      S.openTool = S.openTool === n ? null : n;
      renderToolList();
      break;
    }
    case 'openToday': {
      const t = todayTool();
      S.filter = '全部'; S.openTool = t.n; renderToolList();
      $('#tool-' + t.n)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'nextToday': S.todayOffset++; renderToday(); break;
    /* 低質迴路 */
    case 'warn': { const id = Number(el.dataset.id); S.warnings[id] = !S.warnings[id]; renderLow(); burst(); break; }
    case 'swap': S.swap = el.dataset.id; renderLow(); burst(); break;
    case 'lowFp': S.lowFp = !S.lowFp; renderLow(); burst(); break;
    /* 正視當下 */
    case 'feel': S.feeling = S.feeling === el.dataset.id ? null : el.dataset.id; renderPresent(); renderFoot(); burst(); break;
    case 'afToggle': S.afOpen = !S.afOpen; S.afDone = false; renderPresent(); break;
    case 'afDone': S.afDone = true; renderPresent(); burst(); break;
    case 'afClear': S.afText = ''; S.afDone = false; renderPresent(); break;
    /* 訓練機：計時器 */
    case 'tToggle':
      if (S.running) { S.timeLeft = timeLeftNow(); S.running = false; }
      else { S.endAt = Date.now() + S.timeLeft * 1000; S.running = true; }
      setToast(''); tick();
      break;
    case 'tReset': S.running = false; S.timeLeft = 900; setToast(''); updateTimerUI(); break;
    case 'tDone': S.running = false; S.timeLeft = 0; setToast('你自己撳完成都算數，最緊要記得覆盤三句。'); updateTimerUI(); burst(); break;
    case 'alarm': showAlarm(true); break;
    case 'alarmOff': showAlarm(false); break;
    /* 訓練機：五步 */
    case 'step': stepTo(Number(el.dataset.n), true); break;
    case 'prev': stepTo(S.step - 1, false); break;
    case 'next': stepTo(S.step + 1, true); break;
    case 'finish': setToast('叮！你完成咗一圈啦。下次兜圈嗰陣，你會比今次更快認到路。'); burst(); break;
    case 'saveMap': {
      let msg;
      if (!S.review.some(Boolean)) msg = '先寫低最少一句覆盤，先有地圖可以存。';
      else {
        const d = new Date();
        const list = loadMaps();
        list.unshift({ date: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`, topic: S.topic, review: S.review.slice(), cross: S.crossStart });
        msg = saveMaps(list.slice(0, 50)) ? '📍 地圖存好咗，只存喺呢部手機。' : '呢個瀏覽器唔俾儲存（可能係無痕模式），可以影張相留低。';
        renderSteps(); renderLoop();
      }
      const m = $('#mapMsg'); if (m) { m.textContent = msg; m.hidden = false; }
      break;
    }
    case 'delMap': { const list = loadMaps(); list.splice(Number(el.dataset.i), 1); saveMaps(list); renderSteps(); renderLoop(); break; }
    /* 小測驗 */
    case 'quiz': S.quiz[Number(el.dataset.q)] = el.dataset.k; renderQuiz(); burst(); break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'remind') { S.showReminders = e.target.checked; renderLoop(); }
});

/* 打字：只更新狀態同個別細格，唔重畫，所以唔會甩焦點 */
document.addEventListener('input', (e) => {
  const el = e.target;
  const key = el.dataset.bind;
  if (!key) return;
  if (Array.isArray(S[key])) {
    S[key][Number(el.dataset.i)] = el.value;
    if (key === 'facts') { const c = $('#factCount'); if (c) c.textContent = `${S.facts.filter(Boolean).length}/3`; }
    if (key === 'hyps') { const c = $('#hypCount'); if (c) c.textContent = `${S.hyps.filter(Boolean).length}/3`; }
    return;
  }
  S[key] = el.value;
  if (key === 'fpTrue' || key === 'fpAssume') { if (S.fpShown) { S.fpShown = false; updateFpResult(); } }
  if (key === 'pauseNote') { const p = $('#pauseEcho'), t = $('#pauseEchoText'); if (p && t) { t.textContent = el.value; p.hidden = !el.value; } }
  if (key === 'afText') { S.afDone = false; const m = $('#afMsg'); if (m) m.hidden = true; }
});

/* ============================================================
   3e. 計時器同啟動
   ============================================================ */
/* 呼吸字：每 3 秒換一次，只改兩個字，唔重畫 */
setInterval(() => {
  S.breath = S.breath === '吸吸' ? '呼' : '吸吸';
  if (S.sighing) return;
  const w = $('#bWord'), h = $('#bHint');
  if (w) w.textContent = S.breath;
  if (h) h.textContent = S.breath === '吸吸' ? '慢慢吸入…' : '慢慢呼出…';
}, 3000);

/* 計時器跟真實時間計：熄咗螢幕、轉咗去第二個 app，返嚟都係啱 */
function timeLeftNow() {
  return S.running ? Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000)) : S.timeLeft;
}
function updateTimerUI() {
  const left = timeLeftNow();
  const used = 900 - left;
  const pct = (used / 900) * 100;
  const set = (id, text) => { const el = $(id); if (el && el.textContent !== text) el.textContent = text; };
  set('#tNum', `${pad2(Math.floor(left / 60))}:${pad2(left % 60)}`);
  set('#tPct', `已完成 ${Math.round(pct)}%`);
  set('#tState', S.running ? '● 進行中' : '已暫停');
  set('#tToggle', S.running ? '❚❚ 暫停' : '▶ 開始');
  const bar = $('#tBar'); if (bar) bar.style.width = pct + '%';
  const ph = $('#tPhase');
  if (ph) {
    const now = used < 120 ? 0 : used < 720 ? 1 : 2;
    const active = S.running || used > 0;
    const html = ['定題', '守一', '覆盤'].map((p, i) => `<span class="${active && i === now ? 'now' : ''}">${p}</span>`).join('');
    if (ph.innerHTML !== html) ph.innerHTML = html;
  }
}
function tick() {
  if (S.running && timeLeftNow() <= 0) {
    S.running = false; S.timeLeft = 0;
    setToast('叮！15 分鐘完成，唔好急住開新嘢，先覆盤三句啦。');
  }
  updateTimerUI();
}
setInterval(() => { if (S.running) tick(); }, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

renderTicker();
renderShapes();
renderHero();
renderBreath();
renderStuck();
renderToolsIntro();
renderToday();
renderFp();
renderToolList();
renderLow();
renderPresent();
renderTrainerIntro();
renderTimer();
renderSteps();
renderLoop();
renderQuiz();
renderFoot();
</script>
</body>
</html>
