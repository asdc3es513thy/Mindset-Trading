  --surface:#FFFFFF;
  --muted:#6B5D4F;
}

@media (prefers-color-scheme: dark){
  :root{
    --cream:#231E17;
    --cream2:#2E271E;
    --ink:#FFF6E9;
    --surface:#332A20;
    --muted:#D8C9B5;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  overflow-x:clip
}

.font-play{
  font-family:"ZCOOL KuaiLe","Noto Sans TC",sans-serif;
  letter-spacing:.02em
}

.breath-core{
  animation:breath 6s ease-in-out infinite
}

@keyframes breath{
  0%,100%{
    transform:scale(.86)
  }

  38%{
    transform:scale(1.18)
  }

  55%{
    transform:scale(1.22)
  }

  78%{
    transform:scale(.92)
  }
}

.breath-ring{
  animation:ringPulse 6s ease-in-out infinite
}

@keyframes ringPulse{
  0%,100%{
    transform:scale(.92);
    opacity:.35
  }

  40%{
    transform:scale(1.25);
    opacity:.9
  }

  75%{
    transform:scale(1.05);
    opacity:.5
  }
}

.float-slow{
  animation:floaty 3.2s ease-in-out infinite
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-9px) rotate(2deg)
  }
}

.wiggle{
  animation:wiggle 2.4s ease-in-out infinite
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg)
  }
}

.spin-slow{
  animation:spinSlow 18s linear infinite
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

.marquee-track{
  animation:marquee 18s linear infinite
}

@keyframes marquee{
  to{
    transform:translateX(-50%)
  }
}

.bounce-in{
  animation:bounceIn .45s cubic-bezier(.2,1.6,.4,1) both
}

@keyframes bounceIn{
  from{
    transform:scale(.7) translateY(14px);
    opacity:0
  }

  to{
    transform:scale(1) translateY(0);
    opacity:1
  }
}

.shake{
  animation:shake .4s ease-in-out
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-6px)
  }

  75%{
    transform:translateX(6px)
  }
}

.flip-inner{
  transition:transform .65s cubic-bezier(.3,1.4,.4,1);
  transform-style:preserve-3d;
  position:relative;
  width:100%;
  height:100%
}

.flip-inner.flipped{
  transform:rotateY(180deg)
}

.flip-face{
  backface-visibility:hidden;
  position:absolute;
  inset:0
}

.flip-back{
  transform:rotateY(180deg)
}

.pulse-dot{
  animation:pulseDot 1.2s ease-in-out infinite
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.6);
    opacity:.5
  }
}

.sigh-anim{
  animation:sighPulse 6s ease-in-out 1
}

@keyframes sighPulse{
  0%{
    transform:scale(.85)
  }

  12%{
    transform:scale(1.05)
  }

  22%{
    transform:scale(1.28)
  }

  42%{
    transform:scale(1.3)
  }

  100%{
    transform:scale(.88)
  }
}

.loop-arrow{
  animation:loopDash 2s linear infinite
}

@keyframes loopDash{
  to{
    stroke-dashoffset:-24
  }
}

button,input,textarea{
  font-family:inherit
}

input,textarea{
  outline:none
}

input:focus,textarea:focus{
  border-color:var(--orange)!important;
  box-shadow:0 0 0 4px rgba(255,90,46,.18)
}

/* PLAYFUL GAME LAYER — design only */

.font-hand{
  font-family:"ZCOOL KuaiLe","Noto Sans TC",sans-serif;
  letter-spacing:.04em
}

.wobble-title{
  animation:titleWobble 4.2s ease-in-out infinite;
  transform-origin:0 50%;
  display:inline-block
}

@keyframes titleWobble{
  0%,100%{
    transform:rotate(-1deg) scale(1)
  }

  50%{
    transform:rotate(1.2deg) scale(1.015)
  }
}

.game-card{
  border:3px solid #1B1B1B;
  border-radius:28px;
  box-shadow:8px 8px 0 #1B1B1B;
  transition:transform .18s cubic-bezier(.2,1.8,.4,1),box-shadow .18s ease
}

.game-card:hover{
  transform:translateY(-6px) rotate(-.6deg) scale(1.015);
  box-shadow:10px 12px 0 #1B1B1B
}

.toy-btn{
  border:3px solid #1B1B1B;
  border-radius:999px;
  box-shadow:0 6px 0 #1B1B1B;
  transition:transform .12s ease,box-shadow .12s ease,filter .15s ease;
  will-change:transform
}

.toy-btn:hover{
  transform:translateY(-2px) rotate(-1deg) scale(1.04);
  filter:brightness(1.05)
}

.toy-btn:active{
  transform:translateY(4px) scale(.97);
  box-shadow:0 1px 0 #1B1B1B
}

.toy-card{
  border:3px solid #1B1B1B;
  border-radius:26px;
  box-shadow:0 7px 0 #1B1B1B;
  transition:transform .14s ease,box-shadow .14s ease
}

.toy-card:hover{
  transform:translateY(-4px) rotate(.7deg)
}

.toy-card:active{
  transform:translateY(5px) scale(.98);
  box-shadow:0 1px 0 #1B1B1B
}

.sticker{
  position:absolute;
  z-index:20;
  background:#FFD21F;
  border:2.5px solid #1B1B1B;
  border-radius:999px;
  padding:4px 10px;
  font-family:"ZCOOL KuaiLe",sans-serif;
  font-size:13px;
  font-weight:900;
  box-shadow:3px 3px 0 #1B1B1B;
  transform:rotate(-7deg);
  animation:stickerBob 2.6s ease-in-out infinite;
  pointer-events:none;
  white-space:nowrap
}

.sticker.pink{
  background:#FF8FAB;
  color:#fff
}

.sticker.mint{
  background:#7BE8B0
}

.sticker.sky{
  background:#38B6FF;
  color:#fff
}

.sticker.orange{
  background:#FF4D1C;
  color:#fff
}

@keyframes stickerBob{
  0%,100%{
    transform:rotate(-7deg) translateY(0)
  }

  50%{
    transform:rotate(-4deg) translateY(-4px)
  }
}

.breath-core{
  animation:breath 6s ease-in-out infinite;
  box-shadow:0 0 0 6px rgba(255,210,31,.55),0 0 42px rgba(255,77,28,.65),8px 10px 0 #1B1B1B
}

@keyframes breath{
  0%,100%{
    transform:scale(.82)
  }

  38%{
    transform:scale(1.22)
  }

  55%{
    transform:scale(1.28)
  }

  78%{
    transform:scale(.9)
  }
}

.breath-ring{
  animation:ringPulse 6s ease-in-out infinite
}

.float-shape{
  position:absolute;
  pointer-events:none;
  animation:floaty 3.4s ease-in-out infinite;
  filter:drop-shadow(2px 3px 0 rgba(27,27,27,.12))
}

.float-shape.slow{
  animation-duration:4.6s
}

.float-shape.fast{
  animation-duration:2.6s
}

.squiggle{
  width:58px;
  height:18px;
  border:4px solid currentColor;
  border-color:currentColor transparent transparent transparent;
  border-radius:50%
}

.wiggle-arrow{
  animation:arrowWiggle 1.1s ease-in-out infinite;
  display:inline-block
}

@keyframes arrowWiggle{
  0%,100%{
    transform:translateX(0) rotate(0)
  }

  50%{
    transform:translateX(4px) rotate(8deg)
  }
}

.btn-wiggle:hover{
  animation:btnWiggle .35s ease-in-out
}

@keyframes btnWiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-2deg) scale(1.04)
  }

  75%{
    transform:rotate(2deg) scale(1.04)
  }
}

.loop-big{
  animation:loopShake 2.2s ease-in-out infinite
}

@keyframes loopShake{
  0%,86%,100%{
    transform:rotate(-1deg) scale(1)
  }

  88%{
    transform:rotate(2deg) scale(1.03) translateX(-3px)
  }

  92%{
    transform:rotate(-2deg) scale(1.03) translateX(3px)
  }

  96%{
    transform:rotate(1deg)
  }
}

.blob-bg{
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.85) 0 22px,transparent 23px),radial-gradient(circle at 88% 82%,rgba(255,210,31,.65) 0 28px,transparent 29px),radial-gradient(circle at 78% 12%,rgba(123,232,176,.6) 0 18px,transparent 19px)
}

.blob-bg-2{
  background-image:radial-gradient(circle at 8% 82%,rgba(56,182,255,.28) 0 42px,transparent 43px),radial-gradient(circle at 92% 18%,rgba(255,143,171,.32) 0 34px,transparent 35px),radial-gradient(circle at 45% 4%,rgba(255,255,255,.5) 0 20px,transparent 21px)
}

.confetti-piece{
  position:absolute;
  top:-8px;
  width:10px;
  height:16px;
  border-radius:3px;
  border:1.5px solid #1B1B1B;
  animation:confettiFall .95s cubic-bezier(.2,.8,.4,1) forwards;
  pointer-events:none
}

@keyframes confettiFall{
  0%{
    transform:translateY(0) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(148px) rotate(340deg);
    opacity:0
  }
}

.mascot-face{
  transition:transform .25s cubic-bezier(.2,1.8,.4,1)
}

.mascot-face:hover{
  transform:scale(1.08) rotate(-2deg)
}

.mascot-blink{
  animation:mascotBlink 3.6s ease-in-out infinite
}

@keyframes mascotBlink{
  0%,92%,100%{
    transform:scaleY(1)
  }

  94%{
    transform:scaleY(.08)
  }
}

.console-frame{
  border:4px solid #1B1B1B;
  border-radius:34px;
  box-shadow:10px 10px 0 #1B1B1B,0 0 0 6px #FFD21F
}

.rainbow-bar{
  background:linear-gradient(90deg,#FF4D1C,#FFD21F,#00C2A8,#38B6FF,#8B5CFF);
  background-size:200% 100%;
  animation:rainbowSlide 3s linear infinite
}

@keyframes rainbowSlide{
  to{
    background-position:200% 0
  }
}

.dot-grid{
  background-image:radial-gradient(rgba(27,27,27,.14) 2px,transparent 2.5px);
  background-size:22px 22px
}

@media (prefers-reduced-motion:reduce){
  .wobble-title,.float-shape,.sticker,.breath-core,.breath-ring,.loop-big,.wiggle-arrow{
    animation:none!important
  }
}
